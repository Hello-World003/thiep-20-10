<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo QR cho thiệp 20/10</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff3f6;color:#593744;min-height:100vh;display:grid;place-items:center}.box{width:min(560px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 15px 50px #9e45641a}h1{font-family:Georgia,serif;font-weight:500;color:#a34e6b}p{line-height:1.7}input{width:100%;padding:14px;border:1px solid #e7c4d0;border-radius:12px;font:inherit;margin:8px 0 14px}button{border:0;border-radius:99px;background:#b54d72;color:white;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer}#qr{margin:24px auto 12px;display:grid;place-items:center}#qr img,#qr canvas{max-width:100%;height:auto!important}small{color:#9b7783}
</style></head><body><main class="box"><h1>Tạo mã QR cho thiệp 💌</h1><p>Sau khi đăng trang thiệp lên mạng, dán đường link trang thiệp vào đây. Công cụ sẽ tạo QR để người nhận quét mở thiệp.</p><label for="url"><b>Đường link trang thiệp</b></label><input id="url" type="url" placeholder="https://ten-cua-ban.github.io/thiep-20-10/"/><button id="make">Tạo mã QR</button><div id="qr"></div><button id="download" hidden>Tải ảnh QR PNG</button><p><small>Máy cần có Internet để tải thư viện tạo QR. Hãy thử quét mã bằng điện thoại khác trước khi gửi.</small></p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const url=document.querySelector('#url'),qr=document.querySelector('#qr'),download=document.querySelector('#download');document.querySelector('#make').addEventListener('click',()=>{const value=url.value.trim();if(!/^https?:\/\//i.test(value)){alert('Bạn hãy nhập đường link bắt đầu bằng https:// sau khi đăng thiệp lên mạng nhé.');return}if(!window.QRCode){alert('Chưa tải được công cụ QR. Hãy kiểm tra kết nối Internet rồi tải lại trang.');return}qr.innerHTML='';new QRCode(qr,{text:value,width:280,height:280,colorDark:'#321c25',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});download.hidden=false;});download.addEventListener('click',()=>{const canvas=qr.querySelector('canvas');const img=qr.querySelector('img');const data=canvas?canvas.toDataURL('image/png'):img?.src;if(!data){alert('Hãy tạo mã QR trước nhé.');return}const a=document.createElement('a');a.href=data;a.download='ma-QR-thiep-20-10.png';a.click()});
</script></body></html>
